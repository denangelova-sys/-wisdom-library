name: Import Wisdom Library v35

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v35:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          archive=$(find . -maxdepth 1 -type f -name 'Wisdom_Library_SEO_v35*.zip' -print -quit)

          if [ -z "${archive:-}" ]; then
            echo "ZIP not found"
            exit 1
          fi

          rm -rf /tmp/wisdom-v35
          mkdir -p /tmp/wisdom-v35

          unzip -q "$archive" -d /tmp/wisdom-v35

          cp -a /tmp/wisdom-v35/. ./

          rm -f "$archive"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Wisdom Library SEO v35"
          git push
