name: Fix themes variable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "const themess="
          new = "const themes="
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly 1 occurrence, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-themes.yml
          git add index.html .github/workflows/fix-themes.yml
          git commit -m "Fix themes variable in index"
          git push
