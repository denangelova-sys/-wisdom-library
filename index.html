<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>Wisdom Library — Библиотека на мъдростта</title>
<meta name="description" content="Библиотека от мисли и мъдрост на философи, мислители и суфистки автори.">
<style>
:root{--bg:#eee9df;--paper:#fcfaf6;--ink:#211d18;--muted:#756c61;--line:#d8cfc2;--accent:#9a7047;--dark:#17130f;--shadow:0 24px 70px rgba(38,28,17,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(243,238,229,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:.02em}.navlinks{display:flex;gap:8px}.navlinks button,.pill{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:20px;cursor:pointer}.navlinks button.active,.navlinks button:hover{background:#e7dfd3;color:var(--ink)}
main{max-width:1180px;margin:auto;padding:30px 18px 90px}.hero{padding:44px 0 28px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:end}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--accent);font-weight:700}.hero h1{font:500 clamp(42px,7vw,78px)/.95 Georgia,serif;margin:12px 0 18px;max-width:760px}.hero p{font:18px/1.65 Georgia,serif;color:var(--muted);max-width:650px}.today{background:radial-gradient(circle at 85% 15%,rgba(224,191,145,.25),transparent 30%),linear-gradient(135deg,#211b16,#5e4935);color:#f8f0e4;border-radius:28px;padding:30px;min-height:330px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden}.today:after{content:"";position:absolute;inset:auto -60px -90px auto;width:240px;height:240px;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}
.today .quote{font:28px/1.25 Georgia,serif}.today .author{color:#d9c7af}.section{margin-top:42px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section h2{font:500 30px Georgia,serif;margin:0}.small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;cursor:pointer;transition:.18s transform,.18s box-shadow;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.card:before{content:"“";position:absolute;right:16px;top:-18px;font:130px/1 Georgia,serif;color:#e9e0d3;pointer-events:none}.card:hover{transform:translateY(-3px);box-shadow:0 14px 35px rgba(47,34,20,.08)}.card .quote{font:22px/1.38 Georgia,serif}.meta{margin-top:18px;color:var(--muted);font-size:13px}.authorgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.authorcard,.themecard{background:rgba(251,248,242,.65);border:1px solid var(--line);padding:18px;border-radius:16px;cursor:pointer}.authorcard strong,.themecard strong{display:block;font:19px Georgia,serif;margin-bottom:5px}.search{width:100%;padding:15px 18px;border-radius:15px;border:1px solid var(--line);background:var(--paper);outline:none;margin:12px 0 20px}.search:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{border:1px solid var(--line);background:var(--paper)}.pill.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(251,248,242,.96);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottom button{flex:1;max-width:180px;border:0;background:none;color:var(--muted);padding:9px 4px;cursor:pointer}.bottom button.active{color:var(--ink);font-weight:700}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,14,10,.68);display:none;align-items:flex-end;justify-content:center;padding:14px}.overlay.show{display:flex}.detail{background:var(--paper);width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:28px}.close{float:right;border:0;background:#e9e1d5;border-radius:50%;width:38px;height:38px;cursor:pointer}.detailbg{border-radius:24px;padding:42px 30px;margin:22px 0;color:#f9f0e4;position:relative;overflow:hidden;box-shadow:var(--shadow)}.detailbg:after{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-100px;bottom:-120px;box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 70px rgba(255,255,255,.025)}.detailbg .quote{font:clamp(27px,5vw,43px)/1.18 Georgia,serif;position:relative;z-index:1}.detailbg .author{position:relative;z-index:1}.theme-love{background:radial-gradient(circle at 80% 20%,rgba(218,169,151,.28),transparent 35%),linear-gradient(135deg,#4a2c2b,#76544a)}.theme-life{background:linear-gradient(135deg,#26372f,#5d6d55)}.theme-wisdom{background:radial-gradient(circle at 20% 10%,rgba(224,197,149,.22),transparent 32%),linear-gradient(135deg,#2b2925,#665e50)}.theme-suffering{background:radial-gradient(circle at 75% 15%,rgba(132,147,158,.2),transparent 30%),linear-gradient(135deg,#1c2227,#3d454a)}.theme-courage{background:linear-gradient(135deg,#42251c,#80523b)}.theme-freedom{background:linear-gradient(135deg,#28445a,#7893a0)}.theme-happiness{background:radial-gradient(circle at 80% 15%,rgba(242,205,121,.28),transparent 35%),linear-gradient(135deg,#5a4424,#907447)}.theme-time{background:linear-gradient(135deg,#30281f,#77664e)}.theme-lonely{background:linear-gradient(135deg,#252a31,#58616b)}.theme-self{background:radial-gradient(circle at 50% 20%,rgba(203,181,148,.16),transparent 30%),linear-gradient(135deg,#25211e,#56483d)}.theme-knowledge{background:linear-gradient(135deg,#263029,#68725f)}.theme-change{background:linear-gradient(135deg,#3c3024,#7a6146)}.theme-spirituality{background:radial-gradient(circle at 50% 10%,rgba(231,205,157,.22),transparent 26%),linear-gradient(135deg,#171b2b,#403e63)}.detailbg .author{margin-top:24px;color:#ddcbb3}.actions{display:flex;gap:10px;flex-wrap:wrap}.action{border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px 15px;cursor:pointer}.action.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:18px}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:60px;line-height:1.6}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:25px}.grid{grid-template-columns:1fr}.authorgrid{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.hero h1{font-size:48px}main{padding-left:14px;padding-right:14px}}

.authorhero{background:linear-gradient(135deg,#211b16,#5c4937);color:#f8f0e4;border-radius:28px;padding:32px;margin-bottom:22px;box-shadow:var(--shadow)}
.authorhero h1{font:500 clamp(38px,6vw,62px)/1 Georgia,serif;margin:8px 0}.authorhero p{color:#d9c9b7;line-height:1.7;max-width:720px}
.authorstats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}.authorstats span{font-size:13px;color:#d8c5ad}
.sharecard{width:min(620px,100%);aspect-ratio:1/1;padding:42px;display:flex;flex-direction:column;justify-content:space-between;border-radius:24px;color:#f8f0e4;background:linear-gradient(145deg,#252019,#765b40);margin:20px auto}.sharecard .bigquote{font:clamp(28px,5vw,46px)/1.2 Georgia,serif}.sharecard .shareauthor{font:17px Georgia,serif}.sourcebadge{display:inline-block;border:1px solid rgba(255,255,255,.22);padding:7px 10px;border-radius:20px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#dfcdb6}
</style>
</head>
<body>
<div class="app">
<header class="top"><nav class="nav">
<div class="brand">Wisdom Library</div>
<div class="navlinks"><button data-page="home">Начало</button><button data-page="authors">Автори</button><button data-page="themes">Теми</button><button data-page="search">Търсене</button><button data-page="saved">Запазени</button></div>
</nav></header>
<main id="main"></main>
<nav class="bottom">

<button data-page="authors">◌<br><span>Автори</span></button>

<script>
const quotes=[{"id":1,"author":"Конфуций","theme":"Знание","quote":"Ученето с постоянство и практика носи радост.","source":"Analects 1.1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":2,"author":"Конфуций","theme":"Самият аз","quote":"Не се смущавай, ако хората не те забелязват; важно е да не изгубиш добродетелта си.","source":"Analects 1.1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":3,"author":"Конфуций","theme":"Самият аз","quote":"Всеки ден изпитвай себе си: бил ли си верен в делата си, искрен с приятелите си и прилежен в ученето?","source":"Analects 1.4","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":4,"author":"Конфуций","theme":"Промяна","quote":"Когато откриеш грешките си, не се страхувай да ги оставиш.","source":"Analects 1.8","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":5,"author":"Конфуций","theme":"Знание","quote":"Ако знаеш нещо — признай, че го знаеш; ако не го знаеш — признай и това. Това е знание.","source":"Analects 2.17","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":6,"author":"Конфуций","theme":"Знание","quote":"Учене без размисъл е напразен труд; размисъл без учене може да бъде опасен.","source":"Analects 2.15","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":7,"author":"Конфуций","theme":"Самият аз","quote":"Виж какво прави човекът, наблюдавай мотивите му и виж в какво намира покой — тогава характерът му трудно може да се скрие.","source":"Analects 2.10","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":8,"author":"Конфуций","theme":"Мъдрост","quote":"Когато срещнеш достоен човек, мисли как да се равняваш на него; когато срещнеш недостоен, обърни поглед към себе си.","source":"Analects 4.17","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":9,"author":"Конфуций","theme":"Време","quote":"Ако човек чуе правилния път сутринта, вечерта може да умре без съжаление.","source":"Analects 4.8","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":10,"author":"Конфуций","theme":"Живот","quote":"Не се тревожа, че нямам място; тревожа се как да стана достоен за него.","source":"Analects 4.14","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":11,"author":"Конфуций","theme":"Самият аз","quote":"Не се тревожа, че не съм познат; търся да бъда достоен да бъда познат.","source":"Analects 4.14","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":12,"author":"Конфуций","theme":"Знание","quote":"Да бъдеш учен и едновременно да не мислиш е загуба на труд.","source":"Analects 2.15","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":13,"author":"Конфуций","theme":"Свобода","quote":"Когато видиш правилното и не го направиш, това е липса на смелост.","source":"Analects 2.24","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":14,"author":"Конфуций","theme":"Мъдрост","quote":"Благородният човек мисли за добродетелта; дребният човек мисли за удобството.","source":"Analects 4.11","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":15,"author":"Конфуций","theme":"Щастие","quote":"Добродетелният намира покой в добродетелта; мъдрият я желае.","source":"Analects 4.2","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":16,"author":"Конфуций","theme":"Любов","quote":"Само добродетелният човек може истински да обича или да мрази другите.","source":"Analects 4.3","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":17,"author":"Конфуций","theme":"Промяна","quote":"Не е нужно да променяш всичко наведнъж; започни от корена.","source":"Analects 1.2","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":18,"author":"Конфуций","theme":"Мъдрост","quote":"Истинската ученост не е натрупване на думи, а превръщане на знанието в действие.","source":"Analects 1.14; editorial rendering","note":"Редакционен преразказ по Analects 1.14.","kind":"paraphrase"},{"id":19,"author":"Конфуций","theme":"Самият аз","quote":"Истинската добродетел започва с внимание към собственото поведение, преди да изисква промяна от другите.","source":"Analects, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":20,"author":"Конфуций","theme":"Знание","quote":"Мъдрият човек не се преструва, че знае онова, което не знае.","source":"Analects 2.17","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":21,"author":"Конфуций","theme":"Мъдрост","quote":"Думите имат стойност, когато действията могат да ги потвърдят.","source":"Analects 2.13","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":22,"author":"Конфуций","theme":"Мъдрост","quote":"Когато пазиш старото знание и непрекъснато придобиваш ново, можеш да учиш и другите.","source":"Analects 2.11","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":23,"author":"Конфуций","theme":"Промяна","quote":"Когато грешиш, най-полезната реакция е да поправиш посоката, а не да защитаваш грешката.","source":"Analects 1.8","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":24,"author":"Конфуций","theme":"Свобода","quote":"Не всяко желание заслужава да бъде следвано; правилното действие поставя граници на желанията.","source":"Analects 4.5","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":25,"author":"Конфуций","theme":"Щастие","quote":"Богатството и почестите са желани, но не бива да се придобиват с цената на правилния път.","source":"Analects 4.5","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":26,"author":"Конфуций","theme":"Мъдрост","quote":"Човекът с принципи избира правилното дори когато то не носи непосредствена изгода.","source":"Analects 4.16","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":27,"author":"Конфуций","theme":"Самота","quote":"Човек може да остане спокоен дори когато другите не разбират стойността му.","source":"Analects 1.1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":28,"author":"Конфуций","theme":"Знание","quote":"Учението става истинско, когато се упражнява, а не само когато се запомня.","source":"Analects 1.1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":29,"author":"Конфуций","theme":"Любов","quote":"Уважението към другите не е слабост; то е част от изграждането на характера.","source":"Analects 1.2-1.6","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":30,"author":"Конфуций","theme":"Мъдрост","quote":"Характерът се вижда не само в големите решения, а и в това как човек се държи в обикновените ситуации.","source":"Analects, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":31,"author":"Конфуций","theme":"Време","quote":"Постоянното отлагане на правилното действие е форма на пропуснат живот.","source":"Analects 4.8, editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":32,"author":"Конфуций","theme":"Смелост","quote":"Да видиш правилното е първата половина; да го направиш е втората.","source":"Analects 2.24, editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":33,"author":"Конфуций","theme":"Самият аз","quote":"Преди да питаш защо другите не те разбират, провери дали самият ти разбираш правилно.","source":"Analects 1.16, editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":34,"author":"Конфуций","theme":"Мъдрост","quote":"Благородният човек не се определя от удобството, което има, а от принципите, които не изоставя.","source":"Analects 4.11","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":35,"author":"Конфуций","theme":"Промяна","quote":"Истинското усъвършенстване е ежедневно: малки корекции, повторени достатъчно дълго.","source":"Analects, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":36,"author":"Конфуций","theme":"Знание","quote":"Да задаваш въпрос, когато не знаеш, е част от ученето, не доказателство за слабост.","source":"Analects, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":37,"author":"Конфуций","theme":"Свобода","quote":"Когато вътрешният ти стандарт е ясен, чуждото одобрение губи част от властта си.","source":"Analects 1.1; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":38,"author":"Конфуций","theme":"Мъдрост","quote":"Добрата среда има значение, защото характерът се влияе от хората и нормите около нас.","source":"Analects 4.1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":39,"author":"Конфуций","theme":"Любов","quote":"Да служиш на другите с искреност е по-важно от впечатлението, което правиш.","source":"Analects 1.7","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":40,"author":"Конфуций","theme":"Самият аз","quote":"Човекът се познава по повторяемите си избори, не по самоописанието си.","source":"Analects 2.10; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":41,"author":"Епиктет","theme":"Свобода","quote":"Някои неща зависят от нас, а други не зависят от нас.","source":"Enchiridion 1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":42,"author":"Епиктет","theme":"Свобода","quote":"В нашата власт са преценките, стремежите, желанията и отвращенията; външните неща не са наши действия.","source":"Enchiridion 1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":43,"author":"Епиктет","theme":"Самият аз","quote":"Не събитията смущават хората, а техните преценки за събитията.","source":"Enchiridion 5","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":44,"author":"Епиктет","theme":"Мъдрост","quote":"Не искай нещата да се случват така, както ти желаеш; желай ги да се случват така, както се случват.","source":"Enchiridion 8","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":45,"author":"Епиктет","theme":"Свобода","quote":"Когато смяташ зависимото от другите за свое, ще бъдеш възпрепятстван и разстроен.","source":"Enchiridion 1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":46,"author":"Епиктет","theme":"Свобода","quote":"Когато приемеш за свое само онова, което наистина зависи от теб, никой не може да те принуди.","source":"Enchiridion 1","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":47,"author":"Епиктет","theme":"Промяна","quote":"Не е достатъчно да говориш за философия; трябва да живееш според нея.","source":"Enchiridion 52","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":48,"author":"Епиктет","theme":"Мъдрост","quote":"Първото място във философията е да прилагаш принципите, а не само да ги обясняваш.","source":"Enchiridion 52","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":49,"author":"Епиктет","theme":"Самият аз","quote":"Ако искаш да се подобриш, приеми спокойно да изглеждаш неразумен в някои външни неща.","source":"Enchiridion 48","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":50,"author":"Епиктет","theme":"Мъдрост","quote":"Не всяко впечатление трябва да бъде прието като истина веднага.","source":"Enchiridion 20","note":"Наш превод на публичнодостъпен исторически превод.","kind":"direct"},{"id":51,"author":"Епиктет","theme":"Свобода","quote":"Свободен е човекът, който не е роб на онова, което не зависи от него.","source":"Discourses / Enchiridion, editorial translation","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":52,"author":"Епиктет","theme":"Щастие","quote":"Търси щастието в това, което е в твоята власт, а не в това, което може да бъде отнето.","source":"Enchiridion 1; editorial translation","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":53,"author":"Епиктет","theme":"Смелост","quote":"Когато срещнеш трудност, първо попитай: какво зависи от мен тук?","source":"Enchiridion 1; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":54,"author":"Епиктет","theme":"Самият аз","quote":"Когато се ядосваш, не обвинявай първо събитието; изследвай преценката, която си направил за него.","source":"Enchiridion 5; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":55,"author":"Епиктет","theme":"Мъдрост","quote":"Преди да действаш, изясни какво е в твоята власт и какво не е.","source":"Enchiridion 1; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":56,"author":"Епиктет","theme":"Свобода","quote":"Да приемеш границите на контрола си не е капитулация; това е начин да насочиш усилието си там, където има смисъл.","source":"Enchiridion 1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":57,"author":"Епиктет","theme":"Самият аз","quote":"Външното събитие и твоето отношение към него са две различни неща.","source":"Enchiridion 5","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":58,"author":"Епиктет","theme":"Мъдрост","quote":"Преди да се бориш с едно впечатление, дай си време да го провериш.","source":"Enchiridion 20","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":59,"author":"Епиктет","theme":"Промяна","quote":"Упражнението е това, което превръща философската идея в характер.","source":"Enchiridion 52","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":60,"author":"Епиктет","theme":"Смелост","quote":"Не всяка трудност е знак, че трябва да се откажеш; понякога тя показва къде трябва да приложиш принципите си.","source":"Discourses, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":61,"author":"Епиктет","theme":"Самота","quote":"Човек може да остане вътрешно свободен дори когато външните обстоятелства са ограничени.","source":"Enchiridion 1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":62,"author":"Епиктет","theme":"Щастие","quote":"Ако поставиш щастието си в нещо, което друг човек контролира, ти предаваш ключа към него.","source":"Enchiridion 1; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":63,"author":"Епиктет","theme":"Мъдрост","quote":"Философията започва да работи едва когато промени поведението.","source":"Enchiridion 52","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":64,"author":"Епиктет","theme":"Самият аз","quote":"Не е нужно да печелиш всеки спор; нужно е да не губиш характера си.","source":"Discourses, editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":65,"author":"Епиктет","theme":"Свобода","quote":"Най-голямата зависимост е да искаш светът да изпълнява всяко твое очакване.","source":"Enchiridion 8; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":66,"author":"Епиктет","theme":"Промяна","quote":"Когато не можеш да промениш събитието, промени начина, по който го посрещаш.","source":"Enchiridion 5/8; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":67,"author":"Епиктет","theme":"Смелост","quote":"Да действаш според принципа си, когато е неудобно, е по-важно от това да го обясняваш красиво.","source":"Enchiridion 52; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":68,"author":"Марк Аврелий","theme":"Самият аз","quote":"Имаш власт над ума си, но не и над външните събития; осъзнай това и ще намериш сила.","source":"Meditations, Book XII; traditional rendering","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":69,"author":"Марк Аврелий","theme":"Промяна","quote":"Препятствието пред действието често става част от самото действие.","source":"Meditations, Book V","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":70,"author":"Марк Аврелий","theme":"Живот","quote":"Животът на всеки е това, което мислите му правят от него.","source":"Meditations, Book V","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":71,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Душата приема цвета на мислите, с които се храни.","source":"Meditations, Book V","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":72,"author":"Марк Аврелий","theme":"Време","quote":"Не живей така, сякаш имаш още безкрайно време.","source":"Meditations, Book IV","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":73,"author":"Марк Аврелий","theme":"Самият аз","quote":"Когато се събудиш сутрин, напомни си, че си се изправил заради човешката работа.","source":"Meditations, Book V","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":74,"author":"Марк Аврелий","theme":"Любов","quote":"При всяко действие си представяй себе си като човек, който действа справедливо и спокойно.","source":"Meditations, Book VIII","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":75,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Това, което не е добро за кошера, не е добро и за пчелата.","source":"Meditations, Book VI","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":76,"author":"Марк Аврелий","theme":"Свобода","quote":"Не губи повече време в спорове за това какъв трябва да бъде добрият човек; бъди такъв.","source":"Meditations, Book X","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":77,"author":"Марк Аврелий","theme":"Живот","quote":"Кратък е животът, а достатъчно много време се губи в несъществени неща.","source":"Meditations, Book IV","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":78,"author":"Марк Аврелий","theme":"Самият аз","quote":"Не се разсейвай от това, което правиш сега; дай му цялото си внимание.","source":"Meditations, Book VIII","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":79,"author":"Марк Аврелий","theme":"Промяна","quote":"Приеми това, което природата ти изпраща, и го обичай като част от общия ред.","source":"Meditations, Book XII","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":80,"author":"Марк Аврелий","theme":"Смелост","quote":"Ако не е правилно, не го прави; ако не е истина, не го казвай.","source":"Meditations, Book XII","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":81,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Много малко е нужно, за да живееш добре, ако разбираш какво е важно.","source":"Meditations, Book IV","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"direct"},{"id":82,"author":"Марк Аврелий","theme":"Време","quote":"Живей сякаш това е последният ти ден, но без хаос — ясно, справедливо и спокойно.","source":"Meditations, selected passages; editorial translation","note":"Наш превод/редакционно изгладена версия на публичнодостъпен исторически превод.","kind":"paraphrase"},{"id":83,"author":"Марк Аврелий","theme":"Самият аз","quote":"Когато умът ти се разпилее, върни го към едно конкретно действие и го извърши добре.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":84,"author":"Марк Аврелий","theme":"Промяна","quote":"Не всяко препятствие трябва да бъде премахнато; някои препятствия могат да се превърнат в част от решението.","source":"Meditations, Book V","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":85,"author":"Марк Аврелий","theme":"Време","quote":"Животът се губи най-бързо в дребни тревоги, които нямат значение след година.","source":"Meditations, selected passages; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":86,"author":"Марк Аврелий","theme":"Любов","quote":"Опитай се да разбираш хората, преди да ги осъждаш.","source":"Meditations, selected passages; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":87,"author":"Марк Аврелий","theme":"Свобода","quote":"Не позволявай на чуждото поведение да управлява вътрешния ти ред.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":88,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Разделяй това, което се случва, от историята, която умът ти разказва за него.","source":"Meditations, selected passages; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":89,"author":"Марк Аврелий","theme":"Смелост","quote":"Когато знаеш кое е правилно, не чакай идеални условия, за да го направиш.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":90,"author":"Марк Аврелий","theme":"Живот","quote":"Качеството на живота се определя повече от начина, по който използваш вниманието си, отколкото от броя на годините.","source":"Meditations, selected passages; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":91,"author":"Марк Аврелий","theme":"Самота","quote":"Можеш да се оттеглиш вътре в себе си по всяко време, но вътрешното убежище изисква ред и яснота.","source":"Meditations, Book IV; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":92,"author":"Марк Аврелий","theme":"Промяна","quote":"Приеми неизбежното, без да добавяш излишна съпротива чрез въображаеми сценарии.","source":"Meditations, selected passages; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":93,"author":"Марк Аврелий","theme":"Щастие","quote":"Не търси добрия живот в това да контролираш света, а в това да изпълняваш добре своята част от него.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":94,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Човек може да има малко и пак да живее богато, ако знае кое е достатъчно.","source":"Meditations, Book IV; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":95,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Пътят, който може да бъде изговорен, не е вечният Път.","source":"Tao Te Ching, 1","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":96,"author":"Лао Дзъ","theme":"Знание","quote":"Който познава другите е разумен; който познава себе си е просветлен.","source":"Tao Te Ching, 33","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":97,"author":"Лао Дзъ","theme":"Свобода","quote":"Който побеждава другите е силен; който побеждава себе си е могъщ.","source":"Tao Te Ching, 33","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":98,"author":"Лао Дзъ","theme":"Живот","quote":"Природата не бърза, но всичко е постигнато.","source":"Tao Te Ching, 34; popular rendering","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":99,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Който знае, че му е достатъчно, е богат.","source":"Tao Te Ching, 33","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":100,"author":"Лао Дзъ","theme":"Промяна","quote":"Когато човек се опитва да контролира света насила, той го поврежда.","source":"Tao Te Ching, 29; rendering","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":101,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Който говори много, често се изчерпва; по-добре е да пазиш вътрешната си простота.","source":"Tao Te Ching, 5; rendering","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":102,"author":"Лао Дзъ","theme":"Самият аз","quote":"Който е доволен от себе си, не се нуждае постоянно от външно доказване.","source":"Tao Te Ching, selected chapters; rendering","note":"Наш превод на публичнодостъпния превод на James Legge.","kind":"direct"},{"id":103,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Най-дълбоките неща не винаги се нуждаят от много думи.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":104,"author":"Лао Дзъ","theme":"Промяна","quote":"Мекото може да надделее над твърдото не чрез сила, а чрез постоянство.","source":"Tao Te Ching, 36-43; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":105,"author":"Лао Дзъ","theme":"Свобода","quote":"Когато желанието за контрол намалее, виждаш повече от това, което вече се случва.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":106,"author":"Лао Дзъ","theme":"Щастие","quote":"Простотата не е липса; тя е способност да различиш необходимото от излишното.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":107,"author":"Лао Дзъ","theme":"Самота","quote":"Тишината може да бъде форма на знание, а не празнота.","source":"Tao Te Ching, selected chapters; editorial rendering","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":108,"author":"Лао Дзъ","theme":"Живот","quote":"Да се движиш в ритъма на нещата понякога е по-мъдро от непрекъснатото насилване на резултата.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":109,"author":"Лао Дзъ","theme":"Смелост","quote":"Истинската сила не винаги изглежда като натиск; понякога изглежда като способност да не насилваш.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":110,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Човекът, който не се нуждае от постоянна демонстрация на силата си, има по-голяма вътрешна свобода.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":111,"author":"Руми","theme":"Любов","quote":"Любовта разширява сърцето, докато границата между „аз“ и „другия“ започва да се променя.","source":"Masnavi, themes of love and transformation","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":112,"author":"Руми","theme":"Духовност","quote":"Търсенето на смисъл често започва там, където старото обяснение вече не е достатъчно.","source":"Masnavi, selected passages","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":113,"author":"Руми","theme":"Промяна","quote":"Раната може да се превърне в място за промяна, но популярната формулировка за „светлината“ не бива да се представя като дословен стих без източник.","source":"Rumi attribution note","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":114,"author":"Руми","theme":"Самият аз","quote":"Човекът може да търси външно онова, което постепенно трябва да открие вътре в себе си.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":115,"author":"Руми","theme":"Любов","quote":"Любовта при Руми е не само чувство, а движение отвъд тесния образ за себе си.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":116,"author":"Руми","theme":"Духовност","quote":"Вътрешното преобразяване е по-дълбоко от промяната на външните обстоятелства.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":117,"author":"Руми","theme":"Мъдрост","quote":"Понякога загубата на старото разбиране е началото на по-дълбоко разбиране.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":118,"author":"Руми","theme":"Самота","quote":"Самотата може да бъде пространство за среща със собствената вътрешна тишина.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":119,"author":"Руми","theme":"Промяна","quote":"Човек не остава същият, когато започне да вижда себе си от по-широка перспектива.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":120,"author":"Руми","theme":"Любов","quote":"Не превръщай една красива фраза в „цитат на Руми“, ако не можеш да посочиш текстовия източник.","source":"Editorial principle for the library","note":"Редакционен преразказ; не е дословен цитат. За Руми атрибуциите ще се проверяват по първоизточник.","kind":"paraphrase"},{"id":121,"author":"Ибн Араби","theme":"Духовност","quote":"Сърцето е способно да се променя и да приема повече от една форма на човешкия опит.","source":"Ibn Arabi, themes from Tarjuman al-Ashwaq","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":122,"author":"Ибн Араби","theme":"Любов","quote":"Любовта може да бъде път към познание, а не само преживяване.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":123,"author":"Ибн Араби","theme":"Мъдрост","quote":"Една гледна точка не изчерпва реалността; духовното разбиране изисква способност да виждаш повече от една форма.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":124,"author":"Ибн Араби","theme":"Духовност","quote":"Вътрешният свят на човека може да бъде място, в което различията се срещат, вместо само да се противопоставят.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":125,"author":"Ибн Араби","theme":"Самият аз","quote":"Опознаването на себе си може да бъде част от по-голямо търсене на смисъл.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":126,"author":"Ибн Араби","theme":"Любов","quote":"Когато любовта стане начин на виждане, другият престава да бъде просто обект на желание.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":127,"author":"Ибн Араби","theme":"Мъдрост","quote":"Духовната перспектива не отменя различията; тя търси по-дълбоката им връзка.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":128,"author":"Ибн Араби","theme":"Промяна","quote":"Човекът се променя, когато разшири представата си за това кое е възможно да бъде.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":129,"author":"Сенека","theme":"Време","quote":"Не казвай, че животът е кратък; по-важният въпрос е как използваш даденото време.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":130,"author":"Сенека","theme":"Време","quote":"Много хора пазят имуществото си внимателно, но оставят времето си да изтича без внимание.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":131,"author":"Сенека","theme":"Мъдрост","quote":"Човек може да живее дълго в календарни години и кратко в действително преживян живот.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":132,"author":"Сенека","theme":"Самият аз","quote":"Пази времето си като ресурс, който никой не може да ти върне.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":133,"author":"Сенека","theme":"Щастие","quote":"Спокойствието не идва от натрупването на още задачи, а от разбирането кое заслужава внимание.","source":"Letters / On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":134,"author":"Сенека","theme":"Смелост","quote":"Не позволявай на страха от бъдещето да открадне настоящия ден.","source":"Letters / Stoic writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":135,"author":"Сенека","theme":"Промяна","quote":"Човек не се нуждае от повече време толкова, колкото от по-малко разпиляване.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":136,"author":"Сенека","theme":"Свобода","quote":"Да зависиш от чуждото мнение означава да дадеш част от вътрешната си свобода на друг човек.","source":"Letters / Stoic writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":137,"author":"Сенека","theme":"Самота","quote":"Самотата може да бъде полезна, когато ти връща собственото ти внимание.","source":"Letters / Stoic writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":138,"author":"Сенека","theme":"Живот","quote":"Живей с усещането, че времето е ограничено, без да превръщаш това в паника.","source":"On the Shortness of Life","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":139,"author":"Марк Аврелий","theme":"Мъдрост","quote":"Не позволявай на едно събитие да завладее целия ти ум.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":140,"author":"Марк Аврелий","theme":"Смелост","quote":"Прави това, което е пред теб, с точност и спокойствие.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":141,"author":"Марк Аврелий","theme":"Свобода","quote":"Външният шум не е длъжен да стане вътрешен шум.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":142,"author":"Марк Аврелий","theme":"Щастие","quote":"Простият живот става по-лек, когато спреш да добавяш ненужни оценки към всяко събитие.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":143,"author":"Марк Аврелий","theme":"Самият аз","quote":"Не можеш да контролираш реакцията на другия, но можеш да контролираш своята.","source":"Meditations, selected passages","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":144,"author":"Епиктет","theme":"Мъдрост","quote":"Първата стъпка към спокойствието е да различиш факт от собствена преценка.","source":"Enchiridion 5","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":145,"author":"Епиктет","theme":"Промяна","quote":"Когато приемеш какво не зависи от теб, енергията ти се освобождава за действие.","source":"Enchiridion 1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":146,"author":"Епиктет","theme":"Щастие","quote":"Не поставяй вътрешното си спокойствие в ръцете на случайността.","source":"Enchiridion 1","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":147,"author":"Епиктет","theme":"Самият аз","quote":"Провери реакцията си преди да решиш, че светът е проблемът.","source":"Enchiridion 5","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":148,"author":"Конфуций","theme":"Мъдрост","quote":"Добрата преценка изисква едновременно учене и размисъл.","source":"Analects 2.15","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":149,"author":"Конфуций","theme":"Смелост","quote":"Да направиш правилното, когато е трудно, е по-съществено от това да говориш за правилното.","source":"Analects 2.24","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":150,"author":"Конфуций","theme":"Самият аз","quote":"Чуждото неразбиране не е причина да изоставиш собственото си усъвършенстване.","source":"Analects 1.1/4.14","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":151,"author":"Лао Дзъ","theme":"Мъдрост","quote":"Не всяко действие изисква натиск; понякога точният момент прави повече от силата.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":152,"author":"Лао Дзъ","theme":"Промяна","quote":"Това, което изглежда слабо, може да има устойчивост, която твърдото няма.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":153,"author":"Лао Дзъ","theme":"Свобода","quote":"Когато не се опитваш да притежаваш всичко, имаш повече пространство да живееш.","source":"Tao Te Ching, selected chapters","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":154,"author":"Руми","theme":"Духовност","quote":"Търсенето на смисъл не е линейна задача; то често променя самия човек, който търси.","source":"Masnavi, selected themes","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":155,"author":"Руми","theme":"Любов","quote":"Не всяка популярна фраза с името Руми зад нея е автентичен цитат — затова библиотеката трябва да показва източника.","source":"Editorial principle","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":156,"author":"Ибн Араби","theme":"Духовност","quote":"Разширяването на перспективата може да превърне противопоставянето в разбиране.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":157,"author":"Ибн Араби","theme":"Любов","quote":"Любовта може да бъде начин за познаване на света, не просто притежание на другия.","source":"Ibn Arabi, selected writings","note":"Редакционен преразказ; не е дословен цитат.","kind":"paraphrase"},{"id":158,"author":"Марк Аврелий","theme":"Живот","quote":"Практическата мъдрост започва с ясно разграничаване на важното от второстепенното.","source":"Meditations","note": function renderHome(){
 let dayNumber=Math.floor(Date.now()/86400000); let featured=quotes[dayNumber%quotes.length];
 main.innerHTML=`<section class="hero"><div><div class="eyebrow">Библиотека на мъдростта</div><h1>Мисли, които остават.</h1><p>Философи, мислители и суфистки автори — събрани в тиха, красива библиотека, която можеш да разглеждаш по автор, тема или настроение.</p></div><div class="today"><div class="eyebrow" style="color:#d5b48d">МИСЪЛ ЗА ДНЕС · СМЕНЯ СЕ ВСЕКИ ДЕН</div><div class="quote">“${esc(featured.quote)}”</div><div class="author">— ${esc(featured.author)}</div></div></section>
<section class="section"><div class="sectionhead"><h2>Последно добавени</h2><span class="small">${quotes.length} мисли в редакционната колекция</span></div><div class="grid">${quotes.slice(0,6).map(card).join("")}</div></section>
<section class="section" style="background:#e7dfd3;border-radius:28px;padding:28px">
<div class="sectionhead"><h2>Как да я използваш</h2></div>
<div class="authorgrid">
<div class="authorcard"><strong>1. Избери тема</strong><span class="small">Любов, свобода, време, промяна и още.</span></div>
<div class="authorcard"><strong>2. Открий автор</strong><span class="small">Виж мислите на конкретен философ или мислител.</span></div>
<div class="authorcard"><strong>3. Запази</strong><span class="small">Събери лична колекция от мисли, към които искаш да се връщаш.</span></div>
<div class="authorcard"><strong>4. Сподели</strong><span class="small">Копирай мисълта или я изпрати директно от телефона.</span></div>
</div></section>
<section class="section"><div class="sectionhead"><h2>Разгледай по тема</h2></div><div class="authorgrid">${themes.slice(0,8).map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} мисли</span></div>`).join("")}</div></section>
<div class="footer">WISDOM LIBRARY · редакционна колекция от 200 мисли<br>Бележка: демо версията умишлено отбелязва спорните атрибуции. Преди публично публикуване цитатите трябва да бъдат редакционно проверени по първоизточник.</div>`;
}
function renderAuthors(){
 main.innerHTML=`<div class="section"><div class="eyebrow">Колекция</div><h1 style="font:500 52px Georgia,serif;margin:10px 0 25px">Автори</h1><div class="authorgrid">${authors.map(a=>`<div class="authorcard" onclick="goAuthor('${a}')"><strong>${a}</strong><span class="small">${quotes.filter(q=>q.author===a).length} мисли</span></div>`).join("")}</div></div>`;
}
function renderThemes(){
 main.innerHTML=`<div class="section"><div class="eyebrow">Колекция</div><h1 style="font:500 52px Georgia,serif;margin:10px 0 25px">Теми</h1><div class="authorgrid">${themes.map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} мисли</span></div>`).join("")}</div></div>`;
}
function renderSearch(){
 let qs=quotes;
 main.innerHTML=`<div class="section"><div class="eyebrow">Търсене</div><h1 style="font:500 52px Georgia,serif;margin:10px 0 15px">Намери мисъл.</h1><input id="searchInput" class="search" placeholder="Автор, тема или дума..." value="${filterTheme||filterAuthor||""}" oninput="doSearch(this.value)"><div id="results" class="grid">${qs.map(card).join("")}</div></div>`;
}
function renderSaved(){
 let qs=quotes.filter(q=>saved.includes(q.id));
 main.innerHTML=`<div class="section"><div class="eyebrow">Твоята колекция</div><h1 style="font:500 52px Georgia,serif;margin:10px 0 25px">Запазени</h1>${qs.length?`<div class="grid">${qs.map(card).join("")}</div>`:`<div class="empty">Все още няма запазени мисли.<br>Отвори цитат и натисни „Запази“.</div>`}</div>`;
}
function doSearch(v){
 let term=v.toLowerCase();
 let qs=quotes.filter(q=>(q.quote+" "+q.author+" "+q.theme).toLowerCase().includes(term));
 document.getElementById("results").innerHTML=qs.length?qs.map(card).join(""):`<div class="empty" style="grid-column:1/-1">Няма намерени мисли.</div>`;
}
function goTheme(t){page="search";filterTheme=t;filterAuthor=null;renderSearch();setTimeout(()=>{let i=document.getElementById("searchInput");i.value=t;doSearch(t)},0);window.scrollTo(0,0)}
function goAuthor(a){renderAuthorPage(a)}
function renderAuthorPage(a){
 const qs=quotes.filter(q=>q.author===a);
 page="authors";
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="authors"));
 main.innerHTML=`<section class="section"><button class="action" onclick="renderAuthors()">← Всички автори</button>
 <div class="authorhero" style="margin-top:18px"><div class="eyebrow" style="color:#d6b58c">Автор</div><h1>${esc(a)}</h1>
 <p>${authorBio(a)}</p><div class="authorstats"><span>${qs.length} мисли в библиотеката</span><span>${[...new Set(qs.map(q=>q.theme))].length} теми</span></div></div>
 <div class="sectionhead"><h2>Мисли от ${esc(a)}</h2></div><div class="grid">${qs.map(card).join("")}</div></section>`;
 window.scrollTo(0,0);
}
function authorBio(a){
 const bios={
 "Марк Аврелий":"Римски император и стоически философ от II век. В „Размишления“ записва лични упражнения за характера, самодисциплината и отношението към нещата извън нашия контрол.",
 "Сенека":"Римски стоически философ и писател, известен с есетата и писмата си за времето, морала, спокойствието и добрия живот.",
 "Епиктет":"Стоически философ, който поставя акцента върху разграничаването между нещата, които зависят от нас, и тези, които не зависят.",
 "Фридрих Ницше":"Немски философ от XIX век, чиято работа разглежда морала, ценностите, културата и самоизграждането.",
 "Лао Дзъ":"Традиционно свързван с даоистката класика „Дао Дъ Дзин“, текст за пътя, простотата, действието и съгласуването с природата.",
 "Конфуций":"Китайски мислител, чиито учения, предадени в „Беседи“, разглеждат характера, ученето, отношенията и обществения ред.",
 "Руми":"Персийски поет и мистик от XIII век. Текстовете му са свързани с любовта, духовното търсене и трансформацията.",
 "Хафиз":"Персийски поет от XIV век, известен с лириката си за любовта, виното, духовността и човешката свобода.",
 "Ибн Араби":"Андалуски мистик и философ от XIII век, една от значимите фигури в историята на суфизма.",
 "Ал-Газали":"Персийски богослов, философ и мистик от XI–XII век, автор на множество трудове за знанието, етиката и духовния живот.",
 "Омар Хайям":"Персийски математик, астроном и поет от XI–XII век; рубаите, приписвани на него, са част от сложна текстова традиция."
 };
 return bios[a]||"Автор от колекцията Wisdom Library. Биографичната бележка предстои да бъде разширена с редакционно проверени източници.";
}
function themeClass(t){return ({'Любов':'love','Живот':'life','Мъдрост':'wisdom','Страдание':'suffering','Смелост':'courage','Свобода':'freedom','Щастие':'happiness','Време':'time','Самота':'lonely','Самият аз':'self','Знание':'knowledge','Промяна':'change','Духовност':'spirituality'})[t]||'wisdom'}
function openDetail(id){
 let q=quotes.find(x=>x.id===id), isSaved=saved.includes(id);
 document.getElementById("detail").innerHTML=`<div class="eyebrow">${esc(q.theme)}</div><div class="detailbg theme-${themeClass(q.theme)}"><div class="quote">“${esc(q.quote)}”</div><div class="author">— ${esc(q.author)}</div></div><p><strong>Източник:</strong> ${esc(q.source)}</p><p class="small">${esc(q.note)}</p><p class="small"><strong>${q.kind==="direct"?"Превод от исторически публичнодостъпен текст":"Редакционен преразказ"}</strong></p><div class="actions"><button class="action primary" onclick="toggleSaved(${q.id})">${isSaved?"♥ Запазено":"♡ Запази"}</button><button class="action" onclick="shareQuote(${q.id})">Сподели</button><button class="action" onclick="showShareCard(${q.id})">Карта</button><button class="action" onclick="copyQuote(${q.id})">Копирай</button></div>`;
 document.getElementById("overlay").classList.add("show");
}
function closeDetail(){document.getElementById("overlay").classList.remove("show")}
function showShareCard(id){
 let q=quotes.find(x=>x.id===id);
 document.getElementById("detail").innerHTML=`<div class="eyebrow">Карта за споделяне</div>
 <div class="sharecard theme-${themeClass(q.theme)}"><span class="sourcebadge">Wisdom Library · ${esc(q.theme)}</span><div class="bigquote">“${esc(q.quote)}”</div><div class="shareauthor">— ${esc(q.author)}</div></div>
 <div class="actions"><button class="action primary" onclick="shareQuote(${q.id})">Сподели текста</button><button class="action" onclick="copyQuote(${q.id})">Копирай</button><button class="action" onclick="openDetail(${q.id})">← Назад</button></div>`;
}
function toggleSaved(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("wisdomSaved",JSON.stringify(saved));openDetail(id)}
async function copyQuote(id){let q=quotes.find(x=>x.id===id);await navigator.clipboard?.writeText(`“${q.quote}” — ${q.author}`);alert("Копирано.");}
async function shareQuote(id){let q=quotes.find(x=>x.id===id),text=`“${q.quote}” — ${q.author}`;if(navigator.share){await navigator.share({title:"Wisdom Library",text})}else{await navigator.clipboard?.writeText(text);alert("Текстът е копиран за споделяне.")}}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;filterTheme=null;filterAuthor=null;render()}));
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeDetail()});
render();
</script>
</body></html>
