e-change{background:linear-gradient(135deg,#3c3024,#7a6146)}.theme-spirituality{background:radial-gradient(circle at 50% 10%,rgba(231,205,157,.22),transparent 26%),linear-gradient(135deg,#171b2b,#403e63)}.detailbg .author{margin-top:24px;color:#ddcbb3}.actions{display:flex;gap:10px;flex-wrap:wrap}.action{border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px 15px;cursor:pointer}.action.primary{background:var(--dark);color:#fff;border-color:var(--dark)}

d translation.","kind":"rendering"},{"id":73,"author":"Marcus Aurelius","theme":"Self","quote":"When you wake in the morning, remind yourself that you have risen for the work of a human being.","source":"Meditations, Book V","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":74,"author":"Marcus Aurelius","theme":"Love","quote":"With every action, imagine yourself as a person acting justly and calmly.","source":"Meditations, Book VIII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":75,"author":"Marcus Aurelius","theme":"Wisdom","quote":"What is not good for the hive is not good for the bee.","source":"Meditations, Book VI","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":76,"author":"Marcus Aurelius","theme":"Freedom","quote":"Waste no more time arguing about what a good person should be. Be one.","source":"Meditations, Book X","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":77,"author":"Marcus Aurelius","theme":"Life","quote":"Life is short, and much time is lost on things that do not matter.","source":"Meditations, Book IV","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":78,"author":"Marcus Aurelius","theme":"Self","quote":"Do not be distracted from what you are doing now; give it your full attention.","source":"Meditations, Book VIII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":79,"author":"Marcus Aurelius","theme":"Change","quote":"Accept what nature sends you, and love it as part of the whole.","source":"Meditations, Book XII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":80,"author":"Marcus Aurelius","theme":"Courage","quote":"If it is not right, do not do it; if it is not true, do not say it.","source":"Meditations, Book XII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":81,"author":"Marcus Aurelius","theme":"Wisdom","quote":"Very little is needed for a good life if you understand what matters.","source":"Meditations, Book IV","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":95,"author":"Laozi","theme":"Wisdom","quote":"The Way that can be spoken of is not the eternal Way.","source":"Tao Te Ching, Chapter 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":96,"author":"Laozi","theme":"Knowledge","quote":"Those who know others are wise; those who know themselves are enlightened.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":97,"author":"Laozi","theme":"Freedom","quote":"Those who overcome others are strong; those who overcome themselves are powerful.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":98,"author":"Laozi","theme":"Life","quote":"Nature does not hurry, yet everything is accomplished.","source":"Tao Te Ching, Chapter 34; popular rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":99,"author":"Laozi","theme":"Wisdom","quote":"Those who know that enough is enough are rich.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":100,"author":"Laozi","theme":"Change","quote":"When people try to control the world by force, they damage it.","source":"Tao Te Ching, Chapter 29; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":101,"author":"Laozi","theme":"Wisdom","quote":"Those who speak too much often exhaust themselves; it is better to preserve inner simplicity.","source":"Tao Te Ching, Chapter 5; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":102,"author":"Laozi","theme":"Self","quote":"Those who are content with themselves do not constantly need proof from the outside.","source":"Tao Te Ching, selected chapters; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":50,"author":"Plato","theme":"Justice","quote":"Justice begins with giving each person what is properly theirs.","source":"Republic, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":51,"author":"Plato","theme":"Wisdom","quote":"The beginning of wisdom is recognizing that appearances do not settle what is true.","source":"Republic, Book V","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":52,"author":"Plato","theme":"Knowledge","quote":"Learning is not merely putting sight into the soul; it is turning the soul toward what is worth knowing.","source":"Republic, Book VII","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":53,"author":"Plato","theme":"Self","quote":"The unexamined life of the mind is easily ruled by whatever happens to be nearest.","source":"Republic, Book VII","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":54,"author":"Plato","theme":"Courage","quote":"Courage is not simply endurance; it is preserving a sound judgment about what ought to be feared.","source":"Republic, Book IV","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":55,"author":"Plato","theme":"Happiness","quote":"A just life is ordered from within, and its harmony is itself a form of happiness.","source":"Republic, Book IV","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":56,"author":"Plato","theme":"Freedom","quote":"The person who is ruled by every appetite is not free, even when no one commands them.","source":"Republic, Book IX","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":57,"author":"Plato","theme":"Love","quote":"Love can begin in attraction to one beautiful thing and rise toward a wider vision of beauty.","source":"Symposium","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":58,"author":"Plato","theme":"Change","quote":"The soul changes when its education changes what it takes to be real and valuable.","source":"Republic, Book VII","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":59,"author":"Plato","theme":"Time","quote":"A life spent chasing appearances can pass before the person ever asks what is truly worth pursuing.","source":"Republic, Book IX","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":60,"author":"Plato","theme":"Solitude","quote":"A mind that cannot be alone with itself remains dependent on the noise of the crowd.","source":"Republic, Book VI","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":61,"author":"Plato","theme":"Spirituality","quote":"The highest inquiry turns the mind from transient things toward what does not perish.","source":"Republic, Book VI","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":62,"author":"Aristotle","theme":"Happiness","quote":"Happiness is not a passing feeling but an activity of the soul expressed through a life of excellence.","source":"Nicomachean Ethics, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":63,"author":"Aristotle","theme":"Virtue","quote":"Moral excellence is formed by repeated action; we become just by doing just things.","source":"Nicomachean Ethics, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":64,"author":"Aristotle","theme":"Courage","quote":"Courage stands between rashness and cowardice, choosing the fitting response to danger.","source":"Nicomachean Ethics, Book III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":65,"author":"Aristotle","theme":"Self","quote":"Character is revealed in what we repeatedly choose, not only in what we intend.","source":"Nicomachean Ethics, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":66,"author":"Aristotle","theme":"Love","quote":"Friendship is essential to a good life because human beings flourish with others, not apart from them.","source":"Nicomachean Ethics, Books VIII–IX","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":67,"author":"Aristotle","theme":"Wisdom","quote":"Practical wisdom is the ability to deliberate well about what will lead to a good life.","source":"Nicomachean Ethics, Book VI","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":68,"author":"Aristotle","theme":"Knowledge","quote":"The life of contemplation has a special dignity because it exercises our highest capacity.","source":"Nicomachean Ethics, Book X","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":69,"author":"Aristotle","theme":"Time","quote":"A single excellent act does not make a life excellent; happiness belongs to a whole life lived well.","source":"Nicomachean Ethics, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":70,"author":"Aristotle","theme":"Change","quote":"What we practice becomes part of our character, so small repeated choices matter.","source":"Nicomachean Ethics, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":71,"author":"Aristotle","theme":"Freedom","quote":"Choice is deliberate desire concerning things that are within our power to act upon.","source":"Nicomachean Ethics, Book III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":72,"author":"Aristotle","theme":"Life","quote":"Every craft and every inquiry aims at some good, while the good life asks what the final aim should be.","source":"Nicomachean Ethics, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":73,"author":"Aristotle","theme":"Suffering","quote":"A virtuous person may suffer misfortune without losing the shape of a good character.","source":"Nicomachean Ethics, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":74,"author":"Seneca","theme":"Courage","quote":"Anger promises strength but often makes the mind less capable of choosing wisely.","source":"On Anger, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":75,"author":"Seneca","theme":"Self","quote":"Delay can weaken anger because a passion that is not fed has less power over judgment.","source":"On Anger, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":76,"author":"Seneca","theme":"Freedom","quote":"No one is free who is ruled by fear, appetite, or dependence on what fortune can take away.","source":"Minor Dialogues","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":77,"author":"Seneca","theme":"Happiness","quote":"A quiet mind does not need a large fortune; it needs freedom from unnecessary desires.","source":"On the Happy Life","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":78,"author":"Seneca","theme":"Time","quote":"It is not that we have too little time; we lose much of what we are given.","source":"On the Shortness of Life","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":79,"author":"Seneca","theme":"Wisdom","quote":"The wise person prepares for changing fortune without making their peace depend on fortune.","source":"On the Happy Life","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":80,"author":"Seneca","theme":"Suffering","quote":"Hardship tests what has been practiced; endurance is strengthened by meeting difficulty deliberately.","source":"Letters to Lucilius, themes of adversity","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":81,"author":"Seneca","theme":"Solitude","quote":"Solitude can be useful when it gives the mind room to examine itself rather than escape itself.","source":"Letters to Lucilius, themes of solitude","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":82,"author":"Seneca","theme":"Change","quote":"Begin with small corrections, because a life is altered by habits more than by resolutions.","source":"Letters to Lucilius, themes of moral progress","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":83,"author":"Seneca","theme":"Love","quote":"Friendship should be chosen for character and cultivated with trust rather than possession.","source":"Letters to Lucilius, themes of friendship","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":84,"author":"Seneca","theme":"Knowledge","quote":"Philosophy is useful when it changes conduct, not merely when it supplies arguments.","source":"Letters to Lucilius, themes of philosophy","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":85,"author":"Seneca","theme":"Courage","quote":"The person who has learned to live with less has already made fortune less frightening.","source":"Letters to Lucilius, themes of simplicity","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":86,"author":"Plutarch","theme":"Self","quote":"The mind is shaped by what it repeatedly attends to, so attention itself deserves discipline.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":87,"author":"Plutarch","theme":"Wisdom","quote":"Good counsel is not only knowing what is right but knowing when and how to apply it.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":88,"author":"Plutarch","theme":"Courage","quote":"Courage is strengthened when reason gives fear its proper measure.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":89,"author":"Plutarch","theme":"Love","quote":"Friendship grows from trust and character, and is weakened when affection becomes mere advantage.","source":"Moralia, essays on friendship","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":90,"author":"Plutarch","theme":"Knowledge","quote":"A learner should examine opinions rather than merely collect them.","source":"Moralia, essays on education","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":91,"author":"Plutarch","theme":"Happiness","quote":"Contentment depends less on abundance than on the way the mind receives what it has.","source":"Moralia, essays on contentment","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":92,"author":"Plutarch","theme":"Change","quote":"A person who can correct a fault early prevents it from becoming a settled habit.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":93,"author":"Plutarch","theme":"Freedom","quote":"The strongest rule is self-rule: mastery of desire is more durable than mastery of others.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":94,"author":"Plutarch","theme":"Life","quote":"A life becomes memorable through character and action, not simply through length.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":95,"author":"Plutarch","theme":"Solitude","quote":"Reflection can turn solitude from emptiness into a place where judgment becomes clearer.","source":"Moralia, ethical essays","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":96,"author":"Cicero","theme":"Justice","quote":"Justice asks us to respect what belongs to others and to keep faith with our obligations.","source":"On Duties, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":97,"author":"Cicero","theme":"Courage","quote":"True courage serves what is honorable rather than merely displaying boldness.","source":"On Duties, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":98,"author":"Cicero","theme":"Wisdom","quote":"Practical judgment considers both what is honorable and what circumstances require.","source":"On Duties, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":99,"author":"Cicero","theme":"Love","quote":"Friendship is strongest when it is grounded in virtue rather than advantage.","source":"On Friendship","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":100,"author":"Cicero","theme":"Happiness","quote":"A good life is measured by the quality of its duties and character, not by possessions alone.","source":"On Duties, Book III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":101,"author":"Cicero","theme":"Knowledge","quote":"Study becomes wisdom when it is joined to judgment and useful action.","source":"Tusculan Disputations","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":102,"author":"Cicero","theme":"Freedom","quote":"The mind is most free when it is not enslaved to fear, pleasure, or public approval.","source":"Tusculan Disputations","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":103,"author":"Cicero","theme":"Time","quote":"Age changes the body, but it need not diminish the value of a life devoted to learning and service.","source":"On Old Age","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":104,"author":"Cicero","theme":"Self","quote":"Self-command is a condition of dignity because a person who cannot govern themselves cannot govern wisely.","source":"On Duties","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":105,"author":"Cicero","theme":"Life","quote":"The honorable life joins private character with responsibility toward the community.","source":"On Duties, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":106,"author":"Mencius","theme":"Love","quote":"Human compassion can be cultivated because the beginnings of benevolence are already present in us.","source":"Mencius, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":107,"author":"Mencius","theme":"Courage","quote":"Great courage grows from acting rightly even when the outcome is uncertain.","source":"Mencius, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":108,"author":"Mencius","theme":"Self","quote":"A person should examine their own conduct before blaming the world for the result.","source":"Mencius, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":109,"author":"Mencius","theme":"Wisdom","quote":"The good ruler cultivates people rather than treating them merely as instruments of power.","source":"Mencius, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":110,"author":"Mencius","theme":"Change","quote":"A small moral impulse becomes character when it is protected and cultivated.","source":"Mencius, Book II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":111,"author":"Mencius","theme":"Freedom","quote":"A society is stronger when people are treated as moral beings rather than as tools of authority.","source":"Mencius, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":112,"author":"Mencius","theme":"Happiness","quote":"Material security matters, but a humane life requires more than material abundance.","source":"Mencius, Book I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":113,"author":"Mencius","theme":"Knowledge","quote":"The heart that recognizes what is right must be trained to preserve and extend that recognition.","source":"Mencius, Book VI","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":114,"author":"Zhuangzi","theme":"Freedom","quote":"Freedom grows when the mind stops insisting that its own limited viewpoint is the whole of reality.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":115,"author":"Zhuangzi","theme":"Wisdom","quote":"What looks certain from one perspective may look entirely different from another.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":116,"author":"Zhuangzi","theme":"Change","quote":"Transformation is woven into life; resisting every change only narrows the field of experience.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":117,"author":"Zhuangzi","theme":"Solitude","quote":"The wise person can move through the world without being trapped by the judgments of the crowd.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":118,"author":"Zhuangzi","theme":"Self","quote":"The self becomes lighter when it is less occupied with defending a fixed identity.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":119,"author":"Zhuangzi","theme":"Life","quote":"Life and death belong to a larger transformation that the individual mind cannot fully grasp.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":120,"author":"Zhuangzi","theme":"Knowledge","quote":"Knowing the limits of knowledge can be a deeper wisdom than collecting more conclusions.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":121,"author":"Zhuangzi","theme":"Happiness","quote":"Ease comes when action follows the nature of things instead of forcing everything into a rigid plan.","source":"Zhuangzi, Inner Chapters","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":122,"author":"Sun Tzu","theme":"Wisdom","quote":"The best strategy begins with knowing both your own position and the position of the other side.","source":"The Art of War, Chapter III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":123,"author":"Sun Tzu","theme":"Courage","quote":"Good leadership does not depend on reckless aggression; it depends on disciplined judgment.","source":"The Art of War, Chapter I","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":124,"author":"Sun Tzu","theme":"Change","quote":"A successful plan adapts to circumstances instead of clinging to a fixed pattern.","source":"The Art of War, Chapter VI","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":125,"author":"Sun Tzu","theme":"Knowledge","quote":"Information becomes an advantage when it is timely, reliable, and understood in context.","source":"The Art of War, Chapter XIII","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":126,"author":"Sun Tzu","theme":"Freedom","quote":"The strongest position is often created by preparation before conflict becomes unavoidable.","source":"The Art of War, Chapter III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":127,"author":"Sun Tzu","theme":"Self","quote":"An opponent is easiest to misread when you have not first understood your own weaknesses.","source":"The Art of War, Chapter X","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":128,"author":"Sun Tzu","theme":"Time","quote":"Speed matters when it preserves initiative, but haste without preparation creates vulnerability.","source":"The Art of War, Chapter II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":129,"author":"Sun Tzu","theme":"Life","quote":"The highest skill is to reach the objective while avoiding needless destruction.","source":"The Art of War, Chapter III","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":130,"author":"Sun Tzu","theme":"Suffering","quote":"Prolonged conflict consumes resources and strength even when neither side sees the cost clearly.","source":"The Art of War, Chapter II","note":"Editorial rendering based on a cited public-domain classical source; not a quotation from a modern published translation.","kind":"rendering"},{"id":131,"author":"Charles Darwin","theme":"Knowledge","quote":"Careful observation reveals patterns that casual sight leaves hidden.","source":"The Origin of Species, Ch. IV","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":132,"author":"Charles Darwin","theme":"Change","quote":"Variation becomes meaningful when it is understood across generations.","source":"The Origin of Species, Ch. IV","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":133,"author":"Charles Darwin","theme":"Life","quote":"Life persists through adaptation, not through stillness.","source":"The Origin of Species, Ch. XIV","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":134,"author":"Charles Darwin","theme":"Wisdom","quote":"The wider the field of observation, the less satisfying simple explanations become.","source":"The Origin of Species, Ch. III","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":135,"author":"Charles Darwin","theme":"Courage","quote":"A difficult idea should be tested by evidence rather than protected by habit.","source":"The Origin of Species, Ch. VI","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":136,"author":"Charles Darwin","theme":"Time","quote":"Great changes may become visible only when time is allowed to reveal them.","source":"The Origin of Species, Ch. XIV","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":137,"author":"Florence Nightingale","theme":"Life","quote":"Good care begins with attention to the conditions in which a person must live.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":138,"author":"Florence Nightingale","theme":"Suffering","quote":"A room, its air, its light, its quiet and its cleanliness can change how suffering is endured.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":139,"author":"Florence Nightingale","theme":"Knowledge","quote":"Observation is useful only when it is disciplined enough to notice what others overlook.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":140,"author":"Florence Nightingale","theme":"Love","quote":"Care becomes meaningful when concern is translated into practical action.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":141,"author":"Florence Nightingale","theme":"Self","quote":"The caregiver must preserve enough order and strength to remain useful to others.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":142,"author":"Florence Nightingale","theme":"Wisdom","quote":"Do not confuse activity with care; first understand what the person actually needs.","source":"Notes on Nursing","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":143,"author":"Hippocrates","theme":"Life","quote":"Life is governed by conditions, rhythms and limits that deserve careful attention.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":144,"author":"Hippocrates","theme":"Knowledge","quote":"Medicine advances when observation is more trusted than assumption.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":145,"author":"Hippocrates","theme":"Suffering","quote":"Small changes in a person’s condition can matter greatly when they are noticed in time.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":146,"author":"Hippocrates","theme":"Change","quote":"The body changes continuously; good judgment must change with what is observed.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":147,"author":"Hippocrates","theme":"Time","quote":"Time can clarify a condition that a single moment cannot explain.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":148,"author":"Hippocrates","theme":"Wisdom","quote":"Good judgment begins by recognizing both what can be known and what remains uncertain.","source":"The Genuine Works of Hippocrates, Aphorisms","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":149,"author":"Leonardo da Vinci","theme":"Knowledge","quote":"Curiosity becomes knowledge when the world is observed with patience.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":150,"author":"Leonardo da Vinci","theme":"Wisdom","quote":"Study nature closely before trusting the picture you have formed in your mind.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":151,"author":"Leonardo da Vinci","theme":"Change","quote":"Nothing remains interesting to the attentive mind in exactly the same form.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":152,"author":"Leonardo da Vinci","theme":"Life","quote":"The living world is a teacher because form and movement are never separate.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":153,"author":"Leonardo da Vinci","theme":"Self","quote":"A maker improves by examining the limits of his own understanding.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":154,"author":"Leonardo da Vinci","theme":"Time","quote":"Patient study turns fleeting impressions into durable understanding.","source":"The Notebooks of Leonardo da Vinci","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":155,"author":"Julius Caesar","theme":"Courage","quote":"Decisive action is strongest when it follows clear knowledge of the situation.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":156,"author":"Julius Caesar","theme":"Change","quote":"In conflict, circumstances change quickly; leadership must remain responsive.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":157,"author":"Julius Caesar","theme":"Wisdom","quote":"Strategy begins with understanding people, terrain, resources and timing together.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":158,"author":"Julius Caesar","theme":"Time","quote":"Timing can turn the same opportunity into success or failure.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":159,"author":"Julius Caesar","theme":"Freedom","quote":"A leader must understand what his people fear, value and hope to preserve.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":160,"author":"Julius Caesar","theme":"Suffering","quote":"War imposes costs that strategy must never treat as abstractions.","source":"De Bello Gallico and Other Commentaries","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":161,"author":"Niccolò Machiavelli","theme":"Wisdom","quote":"Political judgment begins by seeing power as it is, not as we wish it to be.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":162,"author":"Niccolò Machiavelli","theme":"Courage","quote":"A ruler who avoids every difficult decision eventually gives others the power to decide for him.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":163,"author":"Niccolò Machiavelli","theme":"Change","quote":"Fortune changes the field; preparation determines how much of that change can be endured.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":164,"author":"Niccolò Machiavelli","theme":"Freedom","quote":"Institutions remain stable when authority understands both consent and force.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":165,"author":"Niccolò Machiavelli","theme":"Self","quote":"Those who depend entirely on circumstances become vulnerable when circumstances turn.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":166,"author":"Niccolò Machiavelli","theme":"Time","quote":"A danger that is easy to ignore today may become impossible to remove tomorrow.","source":"The Prince","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":167,"author":"Abraham Lincoln","theme":"Freedom","quote":"A durable freedom must be defended as a principle, not merely claimed as a privilege.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":168,"author":"Abraham Lincoln","theme":"Courage","quote":"Moral courage is the willingness to carry a difficult duty when applause is uncertain.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":169,"author":"Abraham Lincoln","theme":"Change","quote":"A divided society can change when people choose responsibility over permanent resentment.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":170,"author":"Abraham Lincoln","theme":"Suffering","quote":"A nation in pain needs both resolve and the humility to recognize the human cost.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":171,"author":"Abraham Lincoln","theme":"Love","quote":"Reconciliation becomes possible when justice is joined with a refusal to dehumanize an opponent.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":172,"author":"Abraham Lincoln","theme":"Life","quote":"The worth of public life is measured by what it leaves possible for those who come after.","source":"The Papers and Writings of Abraham Lincoln, Complete","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":173,"author":"Benjamin Franklin","theme":"Self","quote":"Character grows through repeated practice rather than through a single declaration of good intentions.","source":"The Autobiography of Benjamin Franklin","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":174,"author":"Benjamin Franklin","theme":"Knowledge","quote":"Useful knowledge is knowledge that can be tested, improved and shared.","source":"The Autobiography of Benjamin Franklin","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":175,"author":"Benjamin Franklin","theme":"Happiness","quote":"A satisfying life is built from useful work, good habits, friendship and service.","source":"The Autobiography of Benjamin Franklin","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":176,"author":"Benjamin Franklin","theme":"Time","quote":"A wasted hour is small by itself, but repeated waste becomes a life pattern.","source":"The Autobiography of Benjamin Franklin","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":177,"author":"Benjamin Franklin","theme":"Courage","quote":"Public improvement requires people willing to act before certainty is available.","source":"The Complete Works in Philosophy, Politics and Morals","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":178,"author":"Benjamin Franklin","theme":"Change","quote":"Progress usually comes from many practical improvements joined together.","source":"The Complete Works in Philosophy, Politics and Morals","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":179,"author":"Peter Deunov","theme":"Love","quote":"Love becomes real when it brings greater harmony between the inner life and the world around us.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":180,"author":"Peter Deunov","theme":"Spirituality","quote":"Inner silence can become a place where conscience and meaning are heard more clearly.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":181,"author":"Peter Deunov","theme":"Wisdom","quote":"Wisdom is not only what one knows; it is how one lives what one has understood.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":182,"author":"Peter Deunov","theme":"Self","quote":"The work of the inner life begins with honest attention to one’s own thoughts and motives.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":183,"author":"Peter Deunov","theme":"Life","quote":"Life is richer when a person learns to see nature as a source of rhythm, balance and renewal.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":184,"author":"Peter Deunov","theme":"Happiness","quote":"Joy becomes deeper when it is connected with gratitude, goodness and conscious living.","source":"Recorded lectures and thematic collections at Beinsa.bg","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":185,"author":"Socrates","theme":"Knowledge","quote":"Wisdom begins when a person becomes honest about the limits of what they know.","source":"Apology, Crito, and Phaedo","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":186,"author":"Socrates","theme":"Self","quote":"The examined life asks not only what we possess, but what kind of person we are becoming.","source":"Apology, Crito, and Phaedo","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":187,"author":"Socrates","theme":"Courage","quote":"A just conviction can be worth defending even when the crowd does not approve.","source":"Apology, Crito, and Phaedo","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":188,"author":"Socrates","theme":"Freedom","quote":"Freedom without reflection can become another form of dependence.","source":"Crito","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":189,"author":"Socrates","theme":"Life","quote":"A life devoted to truth is measured by the quality of its questions as much as by its answers.","source":"Phaedo","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"},{"id":190,"author":"Socrates","theme":"Wisdom","quote":"Questioning is not weakness; it is a method for separating appearance from understanding.","source":"Apology, Crito, and Phaedo","note":"Editorial rendering based on the cited source; not presented as a verbatim quotation from a modern published translation.","kind":"rendering"}];

function quoteSizeClass(text){
  const n=text.length;
  if(n>190)return "q-xs";
  if(n>150)return "q-sm";
  if(n>105)return "q-md";
  if(n>70)return "q-lg";
  return "q-xl";
}
function artVariant(id){
  const variants=[
    ["50%","50%",1.00],["28%","22%",1.08],["74%","20%",1.05],
    ["18%","58%",1.10],["82%","58%",1.07],["48%","78%",1.12],
    ["34%","42%",1.15],["66%","42%",1.13],["50%","24%",1.18],
    ["24%","76%",1.16],["76%","76%",1.14],["50%","62%",1.09]
  ];
  const v=variants[(id-1)%variants.length];
  return `style="object-position:${v[0]} ${v[1]};transform:scale(${v[2]})"`;
}
function card(q){
  let label=q.kind==="rendering"?"English rendering · source cited":"Editorial paraphrase";
  let i=(q.id-1)%watercolorUrls.length;
  let tone=(i===0||i===2)?"dark":"light";
  let size=quoteSizeClass(q.quote);
  return `<article class="card imagecard" onclick="openDetail(${q.id})" role="button" tabindex="0" aria-label="${esc(q.author)} — ${esc(q.quote)}"><img class="artwork" ${artVariant(q.id)} src="${watercolorUrls[i]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${tone} ${size}">“${esc(q.quote)}”</div><div class="imagecard-author ${tone}">${esc(q.author)}</div></article>`;
}

 let featuredIndex=dayNumber%watercolorUrls.length;
 let featuredTone=(featuredIndex===0||featuredIndex===2)?"dark":"light";
 let featuredSize=quoteSizeClass(featured.quote);
 main.innerHTML=`<section class="home-top">
   <div class="home-copy"><div class="eyebrow">WISDOM LIBRARY</div><h1>Thoughts that stay.</h1><p>A quiet collection of philosophy, wisdom, and reflection — gathered from enduring works and gathered to be read slowly.</p></div>
   <div class="today-wrap"><div class="today-label">CARD OF THE DAY</div><div class="today imagecard" onclick="openDetail(${featured.id})" role="button" tabindex="0" aria-label="Card of the day — ${esc(featured.author)}"><img class="artwork" src="${watercolorUrls[featuredIndex]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${featuredTone} ${featuredSize}">“${esc(featured.quote)}”</div><div class="imagecard-author ${featuredTone}">${esc(featured.author)}</div></div></div>
 </section>
 <section class="section"><div class="sectionhead"><h2>From the library</h2><span class="small">${quotes.length} thoughts</span></div><div class="grid">${quotes.slice(0,12).map(card).join("")}</div><div class="library-note">The collection is built from established philosophical works in the public domain, with each entry carrying its source and rendering note.</div></section>
 <section class="section"><div class="sectionhead"><h2>Explore by theme</h2><span class="small">Browse the collection</span></div><div class="authorgrid">${themes.slice(0,9).map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} thoughts</span></div>`).join("")}</div></section>
 <section class="section"><div class="sectionhead"><h2>Featured authors</h2><span class="small">Browse all authors</span></div><div class="authorgrid">${authors.slice(0,9).map(a=>`<div class="authorcard" onclick="goAuthor('${a.replace(/'/g,"\'")}')"><strong>${esc(a)}</strong><span class="small">${quotes.filter(q=>q.author===a).length} thoughts</span></div>`).join("")}</div></section>
 <section class="section source-library"><div class="sectionhead"><h2>Library of works</h2><span class="small">Classical sources</span></div><div class="source-grid">${sourceCatalog.map(s=>`<a class="source-card" href="${s.url}" target="_blank" rel="noopener"><strong>${esc(s.title)}</strong><span>${esc(s.author)}</span><small>${esc(s.note)}</small></a>`).join("")}</div></section>
 <div class="footer">WISDOM LIBRARY · curated classical collection<br>Source editions and editorial rendering notes are shown with each thought.</div>`;
}
let authorVisible=24;
let currentAuthorResults=authors.slice();
let quoteVisible=24;
let currentQuoteResults=[];
let currentQuoteMode="search";

function quoteResultsHTML(qs,mode="search"){
 currentQuoteResults=qs.slice(); currentQuoteMode=mode;
 let shown=qs.slice(0,quoteVisible);
 return shown.map(card).join("")+(qs.length>shown.length?`<button class="loadmore" onclick="loadMoreQuotes()">Show more · ${qs.length-shown.length} remaining</button>`:"");
}
function loadMoreQuotes(){
 quoteVisible+=24;
 if(currentQuoteMode==="saved") renderSaved();
 else if(currentQuoteMode==="author") renderAuthorPage(currentQuoteResults.length?currentQuoteResults[0].author:"");
 else document.getElementById("results").innerHTML=quoteResultsHTML(currentQuoteResults,currentQuoteMode);
}
function renderAuthors(){
 authorVisible=24; currentAuthorResults=authors.slice();
 main.innerHTML=`<div class="section"><div class="eyebrow">Collection</div><h1 class="collection-title">Authors</h1><p class="page-note">A growing circle of voices whose ideas have shaped the library.</p><div class="collection-tools"><input class="search" id="authorSearch" placeholder="Search authors…" oninput="filterAuthors(this.value)"><span class="small">${authors.length} authors</span></div><div id="authorResults" class="authorgrid">${renderAuthorCards()}</div></div>`;
}
function renderAuthorCards(){
 let shown=currentAuthorResults.slice(0,authorVisible);
 return shown.map(a=>`<div class="authorcard" onclick="goAuthor('${a.replace(/'/g,"\\'")}')"><strong>${esc(a)}</strong><span class="small">${quotes.filter(q=>q.author===a).length} thoughts</span></div>`).join("")+(currentAuthorResults.length>shown.length?`<button class="loadmore" onclick="loadMoreAuthors()">Show more · ${currentAuthorResults.length-shown.length} remaining</button>`:"");
}
function filterAuthors(v){
 let term=v.toLowerCase().trim(); currentAuthorResults=authors.filter(a=>a.toLowerCase().includes(term)); authorVisible=24; document.getElementById("authorResults").innerHTML=currentAuthorResults.length?renderAuthorCards():`<div class="empty" style="grid-column:1/-1">No authors found.</div>`;
}
function loadMoreAuthors(){authorVisible+=24;document.getElementById("authorResults").innerHTML=renderAuthorCards()}
function renderThemes(){
 main.innerHTML=`<div class="section"><div class="eyebrow">Collection</div><h1 class="collection-title">Themes</h1><p class="page-note">Browse the collection by the questions and subjects that return again and again.</p><div class="authorgrid">${themes.map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} thoughts</span></div>`).join("")}</div></div>`;
}
function renderSearch(){
 let qs=filterTheme||filterAuthor?quotes.filter(q=>(!filterTheme||q.theme===filterTheme)&&(!filterAuthor||q.author===filterAuthor)):quotes;
 quoteVisible=24;
 main.innerHTML=`<div class="section"><div class="eyebrow">Search</div><h1 class="collection-title">Find a thought.</h1><p class="page-note">Search across authors, themes, sources, and the full library. The list is paged so it stays fast even when the collection grows.</p><input id="searchInput" class="search" placeholder="Search author, theme, or word…" value="${esc(filterTheme||filterAuthor||"")}" oninput="doSearch(this.value)"><div id="results" class="grid"></div></div>`;
 currentQuoteResults=qs; currentQuoteMode="search"; document.getElementById("results").innerHTML=qs.length?quoteResultsHTML(qs,"search"):`<div class="empty" style="grid-column:1/-1">No thoughts found.</div>`;
}
function renderSaved(){
 let qs=quotes.filter(q=>saved.includes(q.id)); quoteVisible=24; currentQuoteResults=qs; currentQuoteMode="saved";
 main.innerHTML=`<div class="section"><div class="eyebrow">Your collection</div><h1 class="collection-title">Saved</h1><p class="page-note">Keep the thoughts you want to return to.</p>${qs.length?`<div class="grid">${quoteResultsHTML(qs,"saved")}</div>`:`<div class="empty">Your saved thoughts will appear here.<br>Open any thought and tap “Save”.</div>`}</div>`;
}
function doSearch(v){
 let term=v.toLowerCase().trim();
 let qs=quotes.filter(q=>(q.quote+" "+q.author+" "+q.theme+" "+q.source).toLowerCase().includes(term));
 quoteVisible=24; currentQuoteResults=qs; currentQuoteMode="search";
 document.getElementById("results").innerHTML=qs.length?quoteResultsHTML(qs,"search"):`<div class="empty" style="grid-column:1/-1">No thoughts found.</div>`;
}
function goTheme(t){page="search";filterTheme=t;filterAuthor=null;renderSearch();setTimeout(()=>{let i=document.getElementById("searchInput");i.value=t;doSearch(t)},0);window.scrollTo(0,0)}
function goAuthor(a){renderAuthorPage(a)}
function renderAuthorPage(a){
 const qs=quotes.filter(q=>q.author===a);
 page="authors";
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="authors"));
 main.innerHTML=`<section class="section"><button class="action" onclick="renderAuthors()">← All authors</button>
 <div class="authorhero" style="margin-top:18px"><div class="eyebrow" style="color:#d6b58c">Author</div><h1>${esc(a)}</h1>
 <p>${authorBio(a)}</p><div class="authorstats"><span>${qs.length} thoughts in the library</span><span>${[...new Set(qs.map(q=>q.theme))].length} themes</span></div></div>
 <div class="sectionhead"><h2>Thoughts by ${esc(a)}</h2><span class="small">${qs.length} thoughts</span></div><div class="grid">${quoteResultsHTML(qs,"author")}</div></section>`;
 window.scrollTo(0,0);
}
function authorBio(a){
 const bios={
 "Marcus Aurelius":"Roman emperor and Stoic philosopher of the second century CE. In the Meditations, he records practical exercises on character, self-discipline, and what lies beyond our control.",
 "Epictetus":"Stoic philosopher whose teaching emphasizes the distinction between what depends on us and what does not.",
 "Laozi":"Traditionally associated with the Daoist classic Tao Te Ching, a foundational text concerned with the Way, simplicity, action, and alignment with nature.",
 "Confucius":"Chinese thinker whose teachings, preserved in the Analects, explore character, learning, relationships, and social order.",
 "Charles Darwin":"English naturalist whose work on evolution and natural selection transformed modern biology and scientific thought.",
 "Florence Nightingale":"English nurse and writer whose Notes on Nursing helped establish modern principles of nursing care, observation and sanitation.",
 "Hippocrates":"Ancient Greek physician traditionally associated with the Hippocratic corpus and an influential tradition of clinical observation.",
 "Leonardo da Vinci":"Renaissance artist, engineer and investigator whose notebooks connect observation, anatomy, mechanics, nature and art.",
 "Julius Caesar":"Roman general and statesman whose commentaries provide a first-person account of campaigns, leadership and military decision-making.",
 "Niccolò Machiavelli":"Florentine political thinker and author of The Prince, known for analyzing political power, leadership and statecraft in practical terms.",
 "Abraham Lincoln":"American president and statesman whose speeches and writings address union, freedom, responsibility and the moral cost of civil conflict.",
 "Benjamin Franklin":"American printer, scientist, inventor, diplomat and statesman whose writings combine practical ethics, civic life and scientific curiosity.",
 "Peter Deunov":"Bulgarian spiritual teacher whose lectures emphasize love, wisdom, truth, conscious living, harmony and the relationship between human life and nature.",
 "Socrates":"Ancient Athenian philosopher known through Platonic dialogues for the examined life, questioning, moral reasoning and the pursuit of wisdom."
 }
 return bios[a]||"Author from the collection Wisdom Library. Biography to be expanded with editorially verified sources.";
}
function themeClass(t){return ({'Love':'love','Life':'life','Wisdom':'wisdom','Suffering':'suffering','Courage':'courage','Freedom':'freedom','Happiness':'happiness','Time':'time','Solitude':'lonely','Self':'self','Knowledge':'knowledge','Change':'change','Spirituality':'spirituality'})[t]||'wisdom'}
function openDetail(id){
 let q=quotes.find(x=>x.id===id), isSaved=saved.includes(id);
 let detailIndex=(q.id*7)%watercolorUrls.length; let detailTone=(detailIndex===0||detailIndex===2)?"dark":"light"; let detailSize=quoteSizeClass(q.quote);
 document.getElementById("detail").innerHTML=`<div class="eyebrow">${esc(q.theme)}</div><div class="detailbg imagecard"><img class="artwork" ${artVariant(q.id)} src="${watercolorUrls[detailIndex]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${detailTone} ${detailSize}">“${esc(q.quote)}”</div><div class="imagecard-author ${detailTone}">${esc(q.author)}</div></div><p><strong>Source:</strong> ${esc(q.source)}</p><p class="small">${esc(q.note)}</p><p class="small"><strong>${q.kind==="rendering"?"Editorial rendering · source cited":"Editorial paraphrase · not a direct quotation"}</strong></p><div class="actions"><button class="action primary" onclick="toggleSaved(${q.id})">${isSaved?"♥ Saved":"♡ Save"}</button><button class="action" onclick="shareQuote(${q.id})">Share</button><button class="action" onclick="showShareCard(${q.id})">Card</button><button class="action" onclick="copyQuote(${q.id})">Copy</button></div>`;
 document.getElementById("overlay").classList.add("show");
}
function closeDetail(){document.getElementById("overlay").classList.remove("show")}
function showShareCard(id){
 let q=quotes.find(x=>x.id===id), i=(q.id*7)%watercolorUrls.length, tone=(i===0||i===2)?"dark":"light", size=quoteSizeClass(q.quote);
 document.getElementById("detail").innerHTML=`<div class="eyebrow">Share card</div><div class="sharecard imagecard"><img class="artwork" ${artVariant(q.id)} src="${watercolorUrls[i]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="share-bigquote ${tone} ${size}">“${esc(q.quote)}”</div><div class="imagecard-author ${tone}">${esc(q.author)}</div></div><div class="actions"><button class="action primary" onclick="shareQuote(${q.id})">Share text</button><button class="action" onclick="copyQuote(${q.id})">Copy</button><button class="action" onclick="openDetail(${q.id})">← Back</button></div>`;
}
function toggleSaved(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("wisdomSaved",JSON.stringify(saved));openDetail(id)}
async function copyQuote(id){let q=quotes.find(x=>x.id===id);await navigator.clipboard?.writeText(`“${q.quote}” — ${q.author}`);alert("Copied.");}
async function shareQuote(id){let q=quotes.find(x=>x.id===id),text=`“${q.quote}” — ${q.author}`;if(navigator.share){await navigator.share({title:"Wisdom Library",text})}else{await navigator.clipboard?.writeText(text);alert("Text copied for sharing.")}}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;filterTheme=null;filterAuthor=null;render()}));
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".imagecard[role=\"button\"]")){e.preventDefault();e.target.click()}});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeDetail()});
function render(){
  document.querySelectorAll("[data-page]").forEach(b =>
    b.classList.toggle("active", b.dataset.page === page)
  );

  if(page === "home") renderHome();
  else if(page === "authors") renderAuthors();
  else if(page === "themes") renderThemes();
  else if(page === "search") renderSearch();
  else if(page === "saved") renderSaved();
}
  render();</script>
</body></html>
