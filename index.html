h what a person does, observe their motives, and see where they find contentment; then their character is difficult to hide.","source":"Analects 2.10","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":8,"author":"Confucius","theme":"Wisdom","quote":"When you meet a worthy person, think how you might equal them; when you meet an unworthy person, turn your gaze inward.","source":"Analects 4.17","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":9,"author":"Confucius","theme":"Time","quote":"If a person hears the right way in the morning, they can die that evening without regret.","source":"Analects 4.8","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":10,"author":"Confucius","theme":"Life","quote":"I do not worry that I have no place; I worry about becoming worthy of one.","source":"Analects 4.14","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":11,"author":"Confucius","theme":"Self","quote":"I do not worry about being unknown; I seek to be worthy of being known.","source":"Analects 4.14","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":12,"author":"Confucius","theme":"Knowledge","quote":"To study and at the same time never think is to waste one’s effort.","source":"Analects 2.15","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":13,"author":"Confucius","theme":"Freedom","quote":"When you see what is right and fail to do it, that is a lack of courage.","source":"Analects 2.24","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":14,"author":"Confucius","theme":"Wisdom","quote":"The noble person thinks of virtue; the lesser person thinks of comfort.","source":"Analects 4.11","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":15,"author":"Confucius","theme":"Happiness","quote":"The virtuous person finds contentment in virtue; the wise person desires it.","source":"Analects 4.2","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":16,"author":"Confucius","theme":"Love","quote":"Only the virtuous person can truly love or truly hate others.","source":"Analects 4.3","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":17,"author":"Confucius","theme":"Change","quote":"You do not need to change everything at once; begin at the root.","source":"Analects 1.2","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":41,"author":"Epictetus","theme":"Freedom","quote":"Some things are within our control, while others are not.","source":"Enchiridion 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":42,"author":"Epictetus","theme":"Freedom","quote":"Our judgments, impulses, desires, and aversions are within our power; external things are not.","source":"Enchiridion 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":43,"author":"Epictetus","theme":"Self","quote":"It is not events that disturb people, but their judgments about events.","source":"Enchiridion 5","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":44,"author":"Epictetus","theme":"Wisdom","quote":"Do not demand that things happen as you wish; wish for them to happen as they do.","source":"Enchiridion 8","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":45,"author":"Epictetus","theme":"Freedom","quote":"When you regard what belongs to others as your own, you will be hindered and disturbed.","source":"Enchiridion 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":46,"author":"Epictetus","theme":"Freedom","quote":"When you claim as your own only what truly depends on you, no one can compel you.","source":"Enchiridion 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":47,"author":"Epictetus","theme":"Change","quote":"It is not enough to talk about philosophy; you must live according to it.","source":"Enchiridion 52","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":48,"author":"Epictetus","theme":"Wisdom","quote":"The first place in philosophy is to practice its principles, not merely explain them.","source":"Enchiridion 52","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":49,"author":"Epictetus","theme":"Self","quote":"If you want to improve, be willing to appear foolish in some outward matters.","source":"Enchiridion 48","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":50,"author":"Epictetus","theme":"Wisdom","quote":"Not every impression should be accepted as true immediately.","source":"Enchiridion 20","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":68,"author":"Marcus Aurelius","theme":"Self","quote":"You have power over your mind, not over external events; realize this, and you will find strength.","source":"Meditations, Book XII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":69,"author":"Marcus Aurelius","theme":"Change","quote":"The obstacle to action often becomes part of the action itself.","source":"Meditations, Book V","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":70,"author":"Marcus Aurelius","theme":"Life","quote":"The life of each person is what their thoughts make of it.","source":"Meditations, Book V","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":71,"author":"Marcus Aurelius","theme":"Wisdom","quote":"The soul takes on the color of the thoughts with which it feeds.","source":"Meditations, Book V","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":72,"author":"Marcus Aurelius","theme":"Time","quote":"Do not live as though you had endless time.","source":"Meditations, Book IV","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":73,"author":"Marcus Aurelius","theme":"Self","quote":"When you wake in the morning, remind yourself that you have risen for the work of a human being.","source":"Meditations, Book V","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":74,"author":"Marcus Aurelius","theme":"Love","quote":"With every action, imagine yourself as a person acting justly and calmly.","source":"Meditations, Book VIII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":75,"author":"Marcus Aurelius","theme":"Wisdom","quote":"What is not good for the hive is not good for the bee.","source":"Meditations, Book VI","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":76,"author":"Marcus Aurelius","theme":"Freedom","quote":"Waste no more time arguing about what a good person should be. Be one.","source":"Meditations, Book X","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":77,"author":"Marcus Aurelius","theme":"Life","quote":"Life is short, and much time is lost on things that do not matter.","source":"Meditations, Book IV","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":78,"author":"Marcus Aurelius","theme":"Self","quote":"Do not be distracted from what you are doing now; give it your full attention.","source":"Meditations, Book VIII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":79,"author":"Marcus Aurelius","theme":"Change","quote":"Accept what nature sends you, and love it as part of the whole.","source":"Meditations, Book XII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":80,"author":"Marcus Aurelius","theme":"Courage","quote":"If it is not right, do not do it; if it is not true, do not say it.","source":"Meditations, Book XII","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":81,"author":"Marcus Aurelius","theme":"Wisdom","quote":"Very little is needed for a good life if you understand what matters.","source":"Meditations, Book IV","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":95,"author":"Laozi","theme":"Wisdom","quote":"The Way that can be spoken of is not the eternal Way.","source":"Tao Te Ching, Chapter 1","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":96,"author":"Laozi","theme":"Knowledge","quote":"Those who know others are wise; those who know themselves are enlightened.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":97,"author":"Laozi","theme":"Freedom","quote":"Those who overcome others are strong; those who overcome themselves are powerful.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":98,"author":"Laozi","theme":"Life","quote":"Nature does not hurry, yet everything is accomplished.","source":"Tao Te Ching, Chapter 34; popular rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":99,"author":"Laozi","theme":"Wisdom","quote":"Those who know that enough is enough are rich.","source":"Tao Te Ching, Chapter 33","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":100,"author":"Laozi","theme":"Change","quote":"When people try to control the world by force, they damage it.","source":"Tao Te Ching, Chapter 29; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":101,"author":"Laozi","theme":"Wisdom","quote":"Those who speak too much often exhaust themselves; it is better to preserve inner simplicity.","source":"Tao Te Ching, Chapter 5; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"},{"id":102,"author":"Laozi","theme":"Self","quote":"Those who are content with themselves do not constantly need proof from the outside.","source":"Tao Te Ching, selected chapters; rendering","note":"English rendering based on the cited passage; wording is editorial, not a quotation from a modern published translation.","kind":"rendering"}];

function waterStyle(i){return `background-image:url("${watercolorUrls[i%watercolorUrls.length]}")`}

function card(q){
  let label=q.kind==="rendering"?"English rendering · source cited":"Editorial paraphrase";
  let i=(q.id-1)%watercolorUrls.length;
  let tone=(i===0||i===2)?"dark":"light";
  return `<article class="card imagecard" onclick="openDetail(${q.id})" role="button" tabindex="0" aria-label="${esc(q.author)} — ${esc(q.quote)}"><img class="artwork" src="${watercolorUrls[i]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${tone}">“${esc(q.quote)}”</div><div class="imagecard-caption"><span>${esc(q.author)}</span><span>${esc(q.theme)} · ${label}</span></div></article>`;
}
function renderHome(){
 let dayNumber=Math.floor(Date.now()/86400000); let featured=quotes[dayNumber%quotes.length];
 let featuredIndex=dayNumber%watercolorUrls.length; let featuredTone=(featuredIndex===0||featuredIndex===2)?"dark":"light";
 main.innerHTML=`<section class="hero"><div><div class="eyebrow">WISDOM LIBRARY</div><h1>Thoughts that stay.</h1><p>A quiet collection of philosophy, wisdom, and reflection — gathered to be read slowly.</p></div><div class="today imagecard" onclick="openDetail(${featured.id})" role="button"><img class="artwork" src="${watercolorUrls[featuredIndex]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${featuredTone}">“${esc(featured.quote)}”</div><div class="imagecard-caption"><span>THOUGHT FOR TODAY</span><span>${esc(featured.author)} · ${esc(featured.source)}</span></div></div></section>
 <section class="section"><div class="sectionhead"><h2>From the library</h2><span class="small">${quotes.length} thoughts</span></div><div class="grid">${quotes.slice(0,6).map(card).join("")}</div></section>
 <section class="section"><div class="sectionhead"><h2>Explore by theme</h2><span class="small">Browse the collection</span></div><div class="authorgrid">${themes.slice(0,8).map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} thoughts</span></div>`).join("")}</div></section>
 <div class="footer">WISDOM LIBRARY · curated collection<br>Sources and editorial rendering notes are shown with each thought.</div>`;
}
function renderAuthors(){
 main.innerHTML=`<div class="section"><div class="eyebrow">Collection</div><h1 class="collection-title" style="font:500 52px/1 "Cormorant Garamond",Georgia,serif;margin:10px 0 10px;letter-spacing:-.015em">Authors</h1><p class="section-intro">A small circle of voices whose ideas have shaped the library.</p><div class="authorgrid">${authors.map(a=>`<div class="authorcard" onclick="goAuthor('${a}')"><strong>${a}</strong><span class="small">${quotes.filter(q=>q.author===a).length} thoughts</span></div>`).join("")}</div></div>`;
}
function renderThemes(){
 main.innerHTML=`<div class="section"><div class="eyebrow">Collection</div><h1 class="collection-title" style="font:500 52px/1 "Cormorant Garamond",Georgia,serif;margin:10px 0 10px;letter-spacing:-.015em">Themes</h1><p class="section-intro">Browse the collection by the questions and subjects that return again and again.</p><div class="authorgrid">${themes.map(t=>`<div class="themecard" onclick="goTheme('${t}')"><strong>${t}</strong><span class="small">${quotes.filter(q=>q.theme===t).length} thoughts</span></div>`).join("")}</div></div>`;
}
function renderSearch(){
 let qs=quotes;
 main.innerHTML=`<div class="section"><div class="eyebrow">Search</div><h1 style="font:500 52px/1 "Cormorant Garamond",Georgia,serif;margin:10px 0 15px;letter-spacing:-.015em">Find a thought.</h1><input id="searchInput" class="search" placeholder="Search author, theme, or word…" value="${filterTheme||filterAuthor||""}" oninput="doSearch(this.value)"><div id="results" class="grid">${qs.map(card).join("")}</div></div>`;
}
function renderSaved(){
 let qs=quotes.filter(q=>saved.includes(q.id));
 main.innerHTML=`<div class="section"><div class="eyebrow">Your collection</div><h1 style="font:500 52px/1 "Cormorant Garamond",Georgia,serif;margin:10px 0 25px;letter-spacing:-.015em">Saved</h1>${qs.length?`<div class="grid">${qs.map(card).join("")}</div>`:`<div class="empty">Your saved thoughts will appear here.<br>Open any thought and tap “Save”.</div>`}</div>`;
}
function doSearch(v){
 let term=v.toLowerCase();
 let qs=quotes.filter(q=>(q.quote+" "+q.author+" "+q.theme+" "+q.source).toLowerCase().includes(term));
 document.getElementById("results").innerHTML=qs.length?qs.map(card).join(""):`<div class="empty" style="grid-column:1/-1">No thoughts found.</div>`;
}
function goTheme(t){page="search";filterTheme=t;filterAuthor=null;renderSearch();setTimeout(()=>{let i=document.getElementById("searchInput");i.value=t;doSearch(t)},0);window.scrollTo(0,0)}
function goAuthor(a){renderAuthorPage(a)}
function renderAuthorPage(a){
 const qs=quotes.filter(q=>q.author===a);
 page="authors";
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="authors"));
 main.innerHTML=`<section class="section"><button class="action" onclick="renderAuthors()">← All authors</button>
 <div class="authorhero" style="margin-top:18px"><div class="eyebrow" style="color:#d6b58c">Author</div><h1>${esc(a)}</h1>
 <p>${authorBio(a)}</p><div class="authorstats"><span>${qs.length} thoughts in the library</span><span>${[...new Set(qs.map(q=>q.theme))].length} themes</span></div></div>
 <div class="sectionhead"><h2>Thoughts by ${esc(a)}</h2></div><div class="grid">${qs.map(card).join("")}</div></section>`;
 window.scrollTo(0,0);
}
function authorBio(a){
 const bios={
 "Marcus Aurelius":"Roman emperor and Stoic philosopher of the second century CE. In the Meditations, he records practical exercises on character, self-discipline, and what lies beyond our control.",
 "Epictetus":"Stoic philosopher whose teaching emphasizes the distinction between what depends on us and what does not.",
 "Laozi":"Traditionally associated with the Daoist classic Tao Te Ching, a foundational text concerned with the Way, simplicity, action, and alignment with nature.",
 "Confucius":"Chinese thinker whose teachings, preserved in the Analects, explore character, learning, relationships, and social order."
 }
 return bios[a]||"Author from the collection Wisdom Library. Biography to be expanded with editorially verified sources.";
}
function themeClass(t){return ({'Love':'love','Life':'life','Wisdom':'wisdom','Suffering':'suffering','Courage':'courage','Freedom':'freedom','Happiness':'happiness','Time':'time','Solitude':'lonely','Self':'self','Knowledge':'knowledge','Change':'change','Spirituality':'spirituality'})[t]||'wisdom'}
function openDetail(id){
 let q=quotes.find(x=>x.id===id), isSaved=saved.includes(id);
 let detailIndex=(q.id*7)%watercolorUrls.length; let detailTone=(detailIndex===0||detailIndex===2)?"dark":"light";
 document.getElementById("detail").innerHTML=`<div class="eyebrow">${esc(q.theme)}</div><div class="detailbg imagecard"><img class="artwork" src="${watercolorUrls[detailIndex]}" alt="Watercolor artwork"><div class="imagecard-shade"></div><div class="imagecard-quote ${detailTone}">“${esc(q.quote)}”</div><div class="imagecard-caption"><span>${esc(q.author)}</span><span>${esc(q.source)}</span></div></div><p><strong>Source:</strong> ${esc(q.source)}</p><p class="small">${esc(q.note)}</p><p class="small"><strong>${q.kind==="rendering"?"English rendering · source cited":"Editorial paraphrase · not a direct quotation"}</strong></p><div class="actions"><button class="action primary" onclick="toggleSaved(${q.id})">${isSaved?"♥ Saved":"♡ Save"}</button><button class="action" onclick="shareQuote(${q.id})">Share</button><button class="action" onclick="showShareCard(${q.id})">Card</button><button class="action" onclick="copyQuote(${q.id})">Copy</button></div>`;
 document.getElementById("overlay").classList.add("show");
}
function closeDetail(){document.getElementById("overlay").classList.remove("show")}
function showShareCard(id){
 let q=quotes.find(x=>x.id===id);
 document.getElementById("detail").innerHTML=`<div class="eyebrow">Share card</div>
 <div class="sharecard watercard" style="${waterStyle((q.id*7)%watercolorUrls.length)}"><span class="sourcebadge">Wisdom Library · ${esc(q.theme)}</span><div class="bigquote">“${esc(q.quote)}”</div><div class="shareauthor">— ${esc(q.author)}</div><div class="sharesource">${q.kind==="rendering"?"English rendering · source cited":"Editorial paraphrase"} · ${esc(q.source)}</div></div>
 <div class="actions"><button class="action primary" onclick="shareQuote(${q.id})">Share text</button><button class="action" onclick="copyQuote(${q.id})">Copy</button><button class="action" onclick="openDetail(${q.id})">← Back</button></div>`;
}
function toggleSaved(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("wisdomSaved",JSON.stringify(saved));openDetail(id)}
async function copyQuote(id){let q=quotes.find(x=>x.id===id);await navigator.clipboard?.writeText(`“${q.quote}” — ${q.author}`);alert("Copied.");}
async function shareQuote(id){let q=quotes.find(x=>x.id===id),text=`“${q.quote}” — ${q.author}`;if(navigator.share){await navigator.share({title:"Wisdom Library",text})}else{await navigator.clipboard?.writeText(text);alert("Text copied for sharing.")}}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;filterTheme=null;filterAuthor=null;render()}));
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".imagecard[role=\"button\"]")){e.preventDefault();e.target.click()}});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeDetail()});
function render(){
  document.querySelectorAll("[data-page]").forEach(b =>
    b.classList.toggle("active", b.dataset.page === page)
  );

  if(page === "home") renderHome();
  else if(page === "authors") renderAuthors();
  else if(page === "themes") renderThemes();
  else if(page === "search") renderSearch();
  else if(page === "saved") renderSaved();
}
  render();</script>
</body></html>
